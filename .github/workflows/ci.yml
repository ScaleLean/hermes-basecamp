name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        hermes-ref: ['63279301bcbdc185c1b07b98a9312eb0c862f26d', 'main']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Hermes Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes-ref }}
          path: hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Hermes Agent
        run: python -m pip install -e hermes-agent
      - name: Install plugin
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --explicit-package-bases .
      - name: Build and clean-install wheel
        run: |
          python -m build
          python -m venv /tmp/hermes-basecamp-wheel
          /tmp/hermes-basecamp-wheel/bin/pip install -e hermes-agent
          /tmp/hermes-basecamp-wheel/bin/pip install dist/*.whl
          /tmp/hermes-basecamp-wheel/bin/python -c "import adapter, policy, operations"
      - name: Validate plugin manifest
        run: hermes plugins doctor . --ci
      - name: Verify frozen SDK inventory and routes
        run: python scripts/generate_sdk_routes.py --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files and Git history
        run: |
          python scripts/scan_secrets.py
          python scripts/scan_secrets.py --history
