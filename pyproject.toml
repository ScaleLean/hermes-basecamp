[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-basecamp"
version = "0.2.0a2"
description = "First-class Basecamp platform integration for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Scale Lean" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["basecamp", "hermes-agent", "ai-agent", "integration"]
dependencies = ["basecamp-sdk>=0.16.0,<0.17", "markdown-it-py>=3,<5"]

[project.urls]
Homepage = "https://github.com/ScaleLean/hermes-basecamp"
Repository = "https://github.com/ScaleLean/hermes-basecamp"
Issues = "https://github.com/ScaleLean/hermes-basecamp/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
hermes-basecamp = "basecamp_cli:main"

[tool.hatch.build.targets.wheel]
include = ["adapter.py", "approval.py", "basecamp_cli.py", "event_model.py", "formatter.py", "health.py", "journal.py", "launchpad_oauth.py", "media.py", "oauth_onboarding.py", "oauth_store.py", "onboarding.py", "operations.py", "policy.py", "poller.py", "replay_store.py", "resource_index.py", "sdk_client.py", "sdk_inventory.py", "tools.py", "trusted_context.py", "verification.py", "webhook_ingress.py", "webhook_reconciliation.py", "plugin.yaml", "scripts/_plugin_loader.py", "scripts/basecamp_canary.py", "scripts/basecamp_doctor.py", "scripts/basecamp_oauth.py", "scripts/basecamp_launchpad_oauth.py"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^tests/", "^scripts/", "^hermes-agent/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests against a disposable Basecamp project"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["hermes-agent"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"adapter.py" = ["BLE001"]
